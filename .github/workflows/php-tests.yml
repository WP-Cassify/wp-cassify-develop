name: Run PHP tests

on: [push, pull_request, workflow_call]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, openssl
          coverage: none

      - name: Check PHP syntax
        run: find wp-cassify php-tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Run all PHP test suites
        run: php php-tests/run.php
