name: Docker Playwright Tests for wordpress (php8)

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: php8 run playwright tests in dockers env and stop it
      run: docker compose up --build --exit-code-from playwright-suite
    - name: Upload Playwright report and results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-php8
        path: |
          docker/playwright-tests/playwright-report
        if-no-files-found: ignore

