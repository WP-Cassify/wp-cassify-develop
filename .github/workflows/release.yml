name: Tag WordPress Plugin SVN Deploy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'WP-Cassify/wp-cassify-develop'
    uses: ./.github/workflows/php-tests.yml

  browser-php8:
    if: github.repository == 'WP-Cassify/wp-cassify-develop'
    uses: ./.github/workflows/docker-playwright-tests.yml

  browser-php7:
    if: github.repository == 'WP-Cassify/wp-cassify-develop'
    uses: ./.github/workflows/docker-playwright-tests-php7.yml

  browser-multisite:
    if: github.repository == 'WP-Cassify/wp-cassify-develop'
    uses: ./.github/workflows/docker-playwright-tests-multisite.yml

  release:
    name: Deploy to WordPress.org SVN
    needs: [test, browser-php8, browser-php7, browser-multisite]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the tag matches the plugin version and stable tag
        shell: bash
        run: |
          version=$(sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' wp-cassify/wp-cassify.php)
          stable=$(sed -nE 's/^Stable tag: ([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' wp-cassify/readme.txt)
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$version" || "$GITHUB_REF_NAME" != "$stable" ]]; then
            echo 'The release tag must match the plugin version and Stable tag.' >&2
            exit 1
          fi

      - name: WordPress Plugin SVN Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          BUILD_DIR: wp-cassify/
          SLUG: wp-cassify
